name: Windows build and protocol tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $hash = (Get-FileHash MchoseTray.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MchoseTray.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path MchoseTray.exe,README.md,README.en.md,USAGE.zh-CN.md,LICENSE,PROTOCOL.md,SHA256SUMS.txt -DestinationPath artifacts/MchoseBatteryTray-Windows.zip
          Copy-Item MchoseTray.exe artifacts/MchoseTray.exe
          $lines = Get-ChildItem artifacts -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MchoseBatteryTray-Windows
          path: artifacts/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MchoseBatteryTray-Windows
          path: artifacts
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "MCHOSE Battery Tray $RELEASE_TAG · Experimental" --notes-file RELEASE_NOTES.md
